---
# Lets GitHub Pages fill in the list of files below. Keep these two lines.
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Class Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#E6EAF0; --ink:#18212B; --muted:#5A6573; --line:#D3DAE3;
  --accent:#2F5BD3; --accent-soft:#E2E9FB;
  --physics:#3B5BDB; --biomed:#C2255C; --tools:#2B8A6E; --other:#66727F;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161D; --surface:#19212B; --sunken:#212B37; --ink:#E6ECF2; --muted:#9AA7B5; --line:#2C3846;
    --accent:#7D9CF5; --accent-soft:#233154;
    --physics:#7D96F2; --biomed:#EE6A93; --tools:#5CC6A4; --other:#9AA7B5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161D; --surface:#19212B; --sunken:#212B37; --ink:#E6ECF2; --muted:#9AA7B5; --line:#2C3846;
  --accent:#7D9CF5; --accent-soft:#233154;
  --physics:#7D96F2; --biomed:#EE6A93; --tools:#5CC6A4; --other:#9AA7B5;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:40px 20px 64px}
header h1{margin:0;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;letter-spacing:-0.02em}
header p{margin:8px 0 0;color:var(--muted);font-size:1.1rem}
.tools{margin:28px 0 8px;display:flex;flex-direction:column;gap:14px}
.search{position:relative}
.search input{width:100%;min-height:52px;padding:12px 16px 12px 46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.05rem}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 15px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-weight:400;opacity:.75}
.swatch{width:10px;height:10px;border-radius:50%;flex:none}
.status{color:var(--muted);font-size:.92rem;min-height:1.4em;margin:6px 0 0}
.group{margin-top:34px}
.group h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:1.25rem}
.group h2 .bar{width:6px;height:22px;border-radius:3px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;color:inherit;text-decoration:none}
.item:hover{background:var(--sunken)}
.item:hover .go{color:var(--accent)}
.item:focus-visible{outline-offset:-3px;border-radius:0}
.icon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.72rem;color:#fff}
.item .t{font-weight:700;font-size:1.08rem;line-height:1.3}
.item .d{color:var(--muted);font-size:.95rem;margin-top:2px}
.item .f{color:var(--muted);font-size:.8rem;margin-top:4px;word-break:break-all}
.go{color:var(--muted);font-weight:700;font-size:.95rem;white-space:nowrap}
.empty{margin-top:34px;padding:28px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty button{margin-top:10px;min-height:42px;padding:8px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
@media (max-width:520px){.item{grid-template-columns:40px minmax(0,1fr)}.go{display:none}.icon{width:40px;height:40px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="siteTitle">Science Class Activities</h1>
    <p id="siteSub">Choose an activity to open it.</p>
  </header>

  <div class="tools">
    <label class="search">
      <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search activities</span>
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="var(--muted)" stroke-width="2"/><path d="M13 13l5 5" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search by topic, like “gravitation” or “heart”" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter by subject"></div>
  </div>
  <p class="status" id="status" role="status"></p>
  <div id="groups"></div>
</div>

<!-- GitHub Pages fills this in with every file in the repository. -->
<script type="application/json" id="repo-files">[{% for f in site.static_files %}{{ f.path | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
<script>
/* =====================================================================
   SETTINGS: edit this section to customize the page.
   ===================================================================== */
const SITE = {
  title: "Science Class Activities",
  subtitle: "Choose an activity to open it.",
  // Leave blank to detect the repository automatically on GitHub Pages.
  // If you use a custom domain, enter it like "your-username/your-repo".
  repo: "",
  // The branch GitHub Pages publishes from. Leave blank for the default branch.
  branch: ""
};

// Optional: give any file a nicer title, a description, or a subject.
// Files in the repository that are not listed here still show up automatically.
const FILES = [
  { file: "er-forecast.html", title: "ER Forecast",
    description: "Predict how many patients an emergency room will see, how long they’ll wait, and what staff and supplies the hospital needs.",
    subject: "Biomedical Science" }
];

// Files that should never appear on this page.
const HIDE = ["index.html", "404.html"];

// File types to show. Others (images, zips, code) are left out.
const SHOW_TYPES = ["html", "htm", "pdf"];

// Subjects, in the order they appear. Files are sorted into a subject when
// their name, folder or title contains one of its keywords.
const SUBJECTS = [
  { name: "AP Physics 1", color: "var(--physics)",
    keywords: ["physics","ap1","kinematic","motion","force","newton","gravit","orbit","circular","centripetal","torque","rotation","rotational","momentum","impulse","collision","energy","work","power","oscillat","spring","pendulum","harmonic","wave","sound","fluid","pressure","buoyan","projectile","friction","incline","displacement","velocity","acceleration","free-fall","freefall","vector","statics"] },
  { name: "Biomedical Science", color: "var(--biomed)",
    keywords: ["biomed","pbs","pltw","heart","cardiac","cell","mitosis","meiosis","dna","rna","gene","genetic","protein","translation","transcription","crispr","blood","anatomy","disease","diabetes","sickle","ecg","ekg","emergency","hospital","patient","medical","forensic","autopsy","infect","immune","bacteria","virus"] },
  { name: "Classroom tools", color: "var(--tools)",
    keywords: ["timer","countdown","clock","stopwatch","random","picker","groups","seating"] }
];
const OTHER = { name: "Other activities", color: "var(--other)" };
/* ===================================================================== */

(function(){
"use strict";
const $ = s => document.querySelector(s);
const CACHE_KEY = "activity-list-v1", CACHE_MIN = 60;
document.title = SITE.title;
$("#siteTitle").textContent = SITE.title;
$("#siteSub").textContent = SITE.subtitle;

let items = [], filter = "All", query = "";

const ext = p => (p.split(".").pop() || "").toLowerCase();
const base = p => p.split("/").pop();
function niceName(p){
  let n = base(p).replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
  n = n.replace(/([a-z])([A-Z])/g, "$1 $2");
  return n.charAt(0).toUpperCase() + n.slice(1);
}
function subjectFor(text){
  const t = text.toLowerCase();
  for (const s of SUBJECTS) if (s.keywords.some(k => t.includes(k))) return s.name;
  return OTHER.name;
}
const subjectInfo = name => SUBJECTS.find(s => s.name === name) || OTHER;
const hrefFor = p => p.split("/").map(encodeURIComponent).join("/");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function readCache(){ try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch(e){ return null; } }
function writeCache(v){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch(e){} }

function detectRepo(){
  if (SITE.repo && SITE.repo.includes("/")) { const [owner, repo] = SITE.repo.split("/"); return { owner, repo }; }
  const host = location.hostname;
  if (!host.endsWith(".github.io")) return null;
  const owner = host.split(".")[0];
  const first = location.pathname.split("/").filter(Boolean)[0];
  const repo = first && !/\.[a-z0-9]+$/i.test(first) ? first : host;
  return { owner, repo };
}

async function listRepoFiles(r){
  const ref = SITE.branch ? encodeURIComponent(SITE.branch) : "HEAD";
  const res = await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/git/trees/${ref}?recursive=1`, { headers: { Accept: "application/vnd.github+json" } });
  if (!res.ok) throw new Error(res.status === 403 || res.status === 429 ? "rate" : "http" + res.status);
  const data = await res.json();
  const paths = data.tree.filter(n => n.type === "blob").map(n => n.path);
  // GitHub Pages can publish from the repository root or from a /docs folder.
  const root = paths.includes("index.html") ? "" : paths.includes("docs/index.html") ? "docs/" : "";
  return paths.filter(p => p.startsWith(root)).map(p => p.slice(root.length));
}

async function readTitle(path){
  try {
    const res = await fetch(hrefFor(path), { cache: "no-store" });
    if (!res.ok) return {};
    const html = (await res.text()).slice(0, 20000);
    const doc = new DOMParser().parseFromString(html, "text/html");
    const title = (doc.querySelector("title")?.textContent || "").trim();
    const desc = (doc.querySelector('meta[name="description"]')?.getAttribute("content") || "").trim();
    return { title, desc };
  } catch(e){ return {}; }
}

function build(paths, titles){
  const seen = new Set();
  const out = [];
  const add = (path, conf) => {
    if (seen.has(path)) return; seen.add(path);
    const t = titles[path] || {};
    const title = conf?.title || t.title || niceName(path);
    const description = conf?.description || t.desc || "";
    const subject = conf?.subject || subjectFor(path + " " + title + " " + description);
    out.push({ path, title, description, subject, type: ext(path) });
  };
  const confFor = p => FILES.find(f => f.file === p);
  paths.filter(p => SHOW_TYPES.includes(ext(p)) && !HIDE.includes(p) && !HIDE.includes(base(p)) && !base(p).startsWith("."))
       .forEach(p => add(p, confFor(p)));
  return out.sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true }));
}

function render(){
  const order = [...SUBJECTS.map(s => s.name), OTHER.name];
  const present = order.filter(n => items.some(i => i.subject === n));
  if (!present.includes(filter) && filter !== "All") filter = "All";
  $("#chips").innerHTML = (present.length > 1 ? ["All", ...present] : []).map(n => {
    const count = n === "All" ? items.length : items.filter(i => i.subject === n).length;
    const sw = n === "All" ? "" : `<span class="swatch" style="background:${subjectInfo(n).color}"></span>`;
    return `<button type="button" class="chip" data-s="${esc(n)}" aria-pressed="${n === filter}">${sw}${esc(n)} <span class="n">${count}</span></button>`;
  }).join("");

  const q = query.trim().toLowerCase();
  const shown = items.filter(i => (filter === "All" || i.subject === filter) &&
    (!q || (i.title + " " + i.description + " " + i.path).toLowerCase().includes(q)));
  if (!items.length) { $("#groups").innerHTML = ""; return; }
  if (!shown.length) {
    $("#groups").innerHTML = `<div class="empty">No activities match “${esc(query)}”.<br><button type="button" id="clear">Show all activities</button></div>`;
    $("#clear").onclick = () => { query = ""; filter = "All"; $("#q").value = ""; render(); $("#q").focus(); };
    return;
  }
  $("#groups").innerHTML = order.filter(n => shown.some(i => i.subject === n)).map(n => {
    const info = subjectInfo(n);
    const rows = shown.filter(i => i.subject === n).map(i => {
      const pdf = i.type === "pdf";
      return `<li><a class="item" href="${hrefFor(i.path)}"${pdf ? ' target="_blank" rel="noopener"' : ""}>
        <span class="icon" style="background:${info.color}" aria-hidden="true">${pdf ? "PDF" : "WEB"}</span>
        <span><span class="t">${esc(i.title)}</span>${i.description ? `<span class="d" style="display:block">${esc(i.description)}</span>` : ""}${i.path.includes("/") ? `<span class="f" style="display:block">${esc(i.path)}</span>` : ""}</span>
        <span class="go">${pdf ? "Open PDF" : "Open"}</span></a></li>`;
    }).join("");
    return `<section class="group"><h2><span class="bar" style="background:${info.color}"></span>${esc(n)}</h2><ul class="list">${rows}</ul></section>`;
  }).join("");
}

$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; filter = b.dataset.s; render(); });
$("#q").addEventListener("input", e => { query = e.target.value; render(); });

function pagesList(){
  try {
    const list = JSON.parse(document.getElementById("repo-files").textContent);
    if (Array.isArray(list) && list.length) return list.map(p => String(p).replace(/^\//, ""));
  } catch(e){}
  return null;
}

async function loadTitles(paths, known){
  const titles = {};
  const pages = paths.filter(p => ["html","htm"].includes(ext(p)) && !HIDE.includes(base(p)) && !FILES.some(f => f.file === p && f.title));
  await Promise.all(pages.slice(0, 80).map(async p => { titles[p] = (known && known[p]) || await readTitle(p); }));
  return titles;
}

async function load(){
  const status = $("#status");
  const fallback = () => build(FILES.map(f => f.file), {});
  const cache = readCache();

  // 1. The list GitHub Pages built into this page (no limits, always current).
  const listed = pagesList();
  if (listed) {
    const sameList = cache && JSON.stringify(cache.paths) === JSON.stringify(listed);
    items = build(listed, sameList ? cache.titles : {}); render();
    const titles = await loadTitles(listed, sameList ? cache.titles : null);
    writeCache({ repo: "pages", time: Date.now(), paths: listed, titles });
    items = build(listed, titles); render();
    return;
  }

  // 2. Ask GitHub for the file list.
  const r = detectRepo();
  const repoKey = r ? r.owner + "/" + r.repo : "";
  const fresh = cache && cache.repo === repoKey && Date.now() - cache.time < CACHE_MIN * 60000;
  if (fresh) { items = build(cache.paths, cache.titles); render(); return; }
  if (!r) { items = fallback(); render(); status.textContent = "Showing the activities listed in this page’s settings. Once it’s on GitHub Pages, every file in the repository appears here automatically."; return; }

  status.textContent = "Loading activities…";
  if (cache && cache.repo === repoKey) { items = build(cache.paths, cache.titles); render(); }
  try {
    const paths = await listRepoFiles(r);
    const titles = await loadTitles(paths, null);
    writeCache({ repo: repoKey, time: Date.now(), paths, titles });
    items = build(paths, titles); render();
    status.textContent = "";
  } catch(e) {
    // 3. Fall back to the saved list, then to the FILES list in the settings.
    if (!items.length) { items = fallback(); render(); }
    status.textContent = e.message === "rate"
      ? "GitHub is limiting how often this list can refresh, so you’re seeing a saved list. Try again in a few minutes."
      : "Couldn’t reach GitHub to refresh the list, so you’re seeing a saved list.";
  }
}
load();
})();
</script>
</body>
</html>
